name: Metrics
# Genera metrics.svg en la raiz del repo y lo commitea solo.
# Requiere el secret METRICS_TOKEN (classic PAT con scopes: repo, read:user).
on:
  schedule:
    - cron: "0 9 * * *" # 06:00 America/Argentina/Buenos_Aires
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: header, activity, community, repositories
          config_timezone: America/Argentina/Buenos_Aires
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytesize, percentage
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
