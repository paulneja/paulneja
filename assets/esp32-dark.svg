<svg xmlns="http://www.w3.org/2000/svg" width="900" height="472" viewBox="0 0 900 472" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" fill="#e6edf3">
  <title id="title">Linux on ESP32-S3</title>
  <desc id="desc">Linux 7.2.4 runs on core 1 of the ESP32-S3; ESP-IDF handles Wi-Fi and BLE on core 0. 16 MB flash, 8 MB PSRAM. With three busy Bash processes on the same 0.9 image, the worst measured switch was 29.3 ms copying memory versus 5.2 to 5.6 ms with cache-MMU remapping. Board suite: 36/36; extra checks: 10/10; cold boots: 20/20. Still NOMMU, without per-process protection or copy-on-write.</desc>
  <style>.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }</style>
  <rect x="0.5" y="0.5" width="899" height="471" rx="14" fill="#0d1117" stroke="#303b49" />
  <text x="32" y="34" fill="#58a6ff" font-size="13" font-weight="600" class="mono">01 / EMBEDDED LINUX</text>
  <text x="32" y="83" font-size="37" font-weight="650">Linux on ESP32-S3</text>
  <text x="32" y="116" fill="#9da7b3" font-size="18" class="mono">Linux 7.2.4 / Xtensa / NOMMU</text>
  <text x="32" y="158" font-size="18">Wi-Fi / SSH / Bash / MicroPython</text>
  <text x="32" y="188" fill="#9da7b3">Hardware RSA through the Linux Crypto API</text>
  <rect x="32" y="214" width="146" height="30" rx="15" fill="#151e2a" stroke="#303b49" />
  <text x="105.0" y="234" fill="#9da7b3" font-size="14" text-anchor="middle" class="mono">16 MB flash</text>
  <rect x="190" y="214" width="150" height="30" rx="15" fill="#151e2a" stroke="#303b49" />
  <text x="265.0" y="234" fill="#9da7b3" font-size="14" text-anchor="middle" class="mono">8 MB PSRAM</text>
  <rect x="520" y="68" width="348" height="144" rx="7" fill="#151e2a" stroke="#303b49" />
  <text x="536" y="93" fill="#9da7b3" font-size="14" class="mono">ESP32-S3</text>
  <rect x="536.0" y="107" width="147.0" height="75" rx="7" fill="#0d1117" stroke="#303b49" />
  <text x="548.0" y="127" fill="#9da7b3" font-size="11" class="mono">CORE 0</text>
  <text x="548.0" y="150" font-size="23" font-weight="600">ESP-IDF</text>
  <text x="548.0" y="170" fill="#9da7b3" font-size="12">Wi-Fi + BLE</text>
  <rect x="705.0" y="107" width="147.0" height="75" rx="7" fill="#0d1117" stroke="#58a6ff" />
  <text x="717.0" y="127" fill="#9da7b3" font-size="11" class="mono">CORE 1</text>
  <text x="717.0" y="150" font-size="23" font-weight="600">Linux</text>
  <text x="717.0" y="170" fill="#9da7b3" font-size="12">kernel + userland</text>
  <path d="M687.0 145H701.0M691.0 141l-4 4 4 4M697.0 141l4 4 -4 4" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="694.0" y="202" fill="#9da7b3" font-size="12" text-anchor="middle" class="mono">shared-memory IPC</text>
  <path d="M32 266H868" fill="none" stroke="#303b49" stroke-width="1" />
  <text x="32" y="297" fill="#58a6ff" font-size="13" font-weight="600" class="mono">FORKED-PROCESS SWITCHING</text>
  <text x="32" y="324" font-size="17">Worst switch / 3 busy Bash processes</text>
  <path d="M150 338L150 414" fill="none" stroke="#202c3b" stroke-width="1" />
  <text x="150" y="433" fill="#9da7b3" font-size="12" text-anchor="middle" class="mono">0</text>
  <path d="M280 338L280 414" fill="none" stroke="#202c3b" stroke-width="1" />
  <text x="280" y="433" fill="#9da7b3" font-size="12" text-anchor="middle" class="mono">10</text>
  <path d="M410 338L410 414" fill="none" stroke="#202c3b" stroke-width="1" />
  <text x="410" y="433" fill="#9da7b3" font-size="12" text-anchor="middle" class="mono">20</text>
  <path d="M540 338L540 414" fill="none" stroke="#202c3b" stroke-width="1" />
  <text x="540" y="433" fill="#9da7b3" font-size="12" text-anchor="middle" class="mono">30</text>
  <text x="32" y="359" fill="#9da7b3">Copy</text>
  <text x="32" y="403" fill="#9da7b3">Remap</text>
  <rect x="150" y="341" width="380.9" height="24" rx="3" fill="#657a93" stroke="none" id="copy-bar" />
  <rect x="150" y="385" width="72.8" height="24" rx="3" fill="#58a6ff" stroke="none" id="remap-bar" />
  <path d="M217.6 381L217.6 413" fill="none" stroke="#e6edf3" stroke-width="1.5" />
  <text x="543" y="359" font-size="17" font-weight="600" class="mono">29.3 ms</text>
  <text x="236" y="403" fill="#58a6ff" font-size="17" font-weight="600" class="mono">5.2–5.6 ms</text>
  <text x="32" y="455" fill="#9da7b3" font-size="13">Same 0.9 image. Cache-MMU path off / on. Lower is better.</text>
  <path d="M644 291L644 433" fill="none" stroke="#303b49" stroke-width="1" />
  <text x="666" y="297" fill="#58a6ff" font-size="13" font-weight="600" class="mono">ON-BOARD CHECKS</text>
  <text x="666" y="344" font-size="28" font-weight="600">36 / 36</text>
  <text x="666" y="365" fill="#9da7b3" font-size="14">board suite</text>
  <text x="783" y="344" font-size="25" font-weight="600">10 / 10</text>
  <text x="783" y="365" fill="#9da7b3" font-size="14">extra checks</text>
  <text x="666" y="407" font-size="28" font-weight="600">20 / 20</text>
  <text x="783" y="407" fill="#9da7b3" font-size="14">cold boots</text>
</svg>
