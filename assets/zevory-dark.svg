<svg xmlns="http://www.w3.org/2000/svg" width="440" height="304" viewBox="0 0 440 304" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" fill="#e6edf3">
  <title id="title">Zevory Linux</title>
  <desc id="desc">Upstream Linux distribution work. Limine boots the kernel, then ZevInit, a PID 1 in Rust linked with musl. The bootstrap has run on real hardware; ZevInit has only been tested in QEMU.</desc>
  <style>.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }</style>
  <rect x="0.5" y="0.5" width="439" height="303" rx="14" fill="#0d1117" stroke="#303b49" />
  <text x="24" y="32" fill="#58a6ff" font-size="13" font-weight="600" class="mono">02 / BOOT &amp; USERSPACE</text>
  <text x="24" y="78" font-size="33" font-weight="650">Zevory Linux</text>
  <text x="24" y="108" fill="#9da7b3" font-size="18">Upstream sources. A Rust PID 1.</text>
  <rect x="24" y="139" width="120" height="64" rx="7" fill="#151e2a" stroke="#303b49" />
  <text x="84" y="167" font-size="20" font-weight="600" text-anchor="middle">Limine</text>
  <text x="84" y="188" fill="#9da7b3" font-size="13" text-anchor="middle" class="mono">bootloader</text>
  <path d="M147 171H157m-4 -4 4 4 -4 4" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="160" y="139" width="120" height="64" rx="7" fill="#151e2a" stroke="#303b49" />
  <text x="220" y="167" font-size="20" font-weight="600" text-anchor="middle">Linux</text>
  <text x="220" y="188" fill="#9da7b3" font-size="13" text-anchor="middle" class="mono">kernel</text>
  <path d="M283 171H293m-4 -4 4 4 -4 4" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="296" y="139" width="120" height="64" rx="7" fill="#151e2a" stroke="#58a6ff" />
  <text x="356" y="167" font-size="20" font-weight="600" text-anchor="middle">ZevInit</text>
  <text x="356" y="188" fill="#9da7b3" font-size="13" text-anchor="middle" class="mono">PID 1</text>
  <text x="24" y="232" fill="#9da7b3">Shell lifecycle / orphan reaping / shutdown</text>
  <path d="M24 250H416" fill="none" stroke="#303b49" stroke-width="1" />
  <text x="24" y="278" font-size="15" font-weight="500">Bootstrap: hardware</text>
  <text x="242" y="278" fill="#58a6ff" font-size="15" font-weight="500">ZevInit: QEMU</text>
</svg>
