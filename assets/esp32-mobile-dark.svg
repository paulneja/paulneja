<svg xmlns="http://www.w3.org/2000/svg" width="440" height="692" viewBox="0 0 440 692" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" fill="#e6edf3">
  <title id="title">Linux on ESP32-S3</title>
  <desc id="desc">Linux 7.2.4 runs on core 1 of the ESP32-S3; ESP-IDF handles Wi-Fi and BLE on core 0. 16 MB flash, 8 MB PSRAM. With three busy Bash processes on the same 0.9 image, the worst measured switch was 29.3 ms copying memory versus 5.2 to 5.6 ms with cache-MMU remapping. Board suite: 36/36; extra checks: 10/10; cold boots: 20/20. Still NOMMU, without per-process protection or copy-on-write.</desc>
  <style>.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }</style>
  <rect x="0.5" y="0.5" width="439" height="691" rx="14" fill="#0d1117" stroke="#303b49" />
  <text x="24" y="31" fill="#58a6ff" font-size="14" font-weight="600" class="mono">01 / EMBEDDED LINUX</text>
  <text x="24" y="78" font-size="33" font-weight="650">Linux on ESP32-S3</text>
  <text x="24" y="110" fill="#9da7b3" font-size="17">Linux 7.2.4 / Xtensa / NOMMU</text>
  <text x="24" y="146" font-size="18">Wi-Fi / SSH / Bash / MicroPython</text>
  <text x="24" y="174" fill="#9da7b3">Hardware RSA via the Linux Crypto API</text>
  <rect x="24" y="196" width="392" height="144" rx="7" fill="#151e2a" stroke="#303b49" />
  <text x="40" y="221" fill="#9da7b3" font-size="14" class="mono">ESP32-S3</text>
  <rect x="40.0" y="235" width="169.0" height="75" rx="7" fill="#0d1117" stroke="#303b49" />
  <text x="52.0" y="255" fill="#9da7b3" font-size="11" class="mono">CORE 0</text>
  <text x="52.0" y="278" font-size="23" font-weight="600">ESP-IDF</text>
  <text x="52.0" y="298" fill="#9da7b3" font-size="12">Wi-Fi + BLE</text>
  <rect x="231.0" y="235" width="169.0" height="75" rx="7" fill="#0d1117" stroke="#58a6ff" />
  <text x="243.0" y="255" fill="#9da7b3" font-size="11" class="mono">CORE 1</text>
  <text x="243.0" y="278" font-size="23" font-weight="600">Linux</text>
  <text x="243.0" y="298" fill="#9da7b3" font-size="12">kernel + userland</text>
  <path d="M213.0 273H227.0M217.0 269l-4 4 4 4M223.0 269l4 4 -4 4" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="220.0" y="330" fill="#9da7b3" font-size="12" text-anchor="middle" class="mono">shared-memory IPC</text>
  <rect x="24" y="357" width="166" height="30" rx="15" fill="#151e2a" stroke="#303b49" />
  <text x="107.0" y="377" fill="#9da7b3" font-size="14" text-anchor="middle" class="mono">16 MB flash</text>
  <rect x="204" y="357" width="176" height="30" rx="15" fill="#151e2a" stroke="#303b49" />
  <text x="292.0" y="377" fill="#9da7b3" font-size="14" text-anchor="middle" class="mono">8 MB PSRAM</text>
  <path d="M24 406H416" fill="none" stroke="#303b49" stroke-width="1" />
  <text x="24" y="436" fill="#58a6ff" font-size="14" font-weight="600" class="mono">FORKED-PROCESS SWITCHING</text>
  <text x="24" y="464" font-size="19">Worst switch / 3 busy Bash processes</text>
  <text x="24" y="497" fill="#9da7b3">Copy</text>
  <text x="416" y="497" font-size="18" font-weight="600" text-anchor="end" class="mono">29.3 ms</text>
  <rect x="24" y="509" width="351.6" height="24" rx="3" fill="#657a93" stroke="none" id="copy-bar" />
  <text x="24" y="562" fill="#9da7b3">Remap</text>
  <text x="416" y="562" fill="#58a6ff" font-size="18" font-weight="600" text-anchor="end" class="mono">5.2–5.6 ms</text>
  <rect x="24" y="574" width="67.2" height="24" rx="3" fill="#58a6ff" stroke="none" id="remap-bar" />
  <path d="M86.4 570L86.4 602" fill="none" stroke="#e6edf3" stroke-width="1.5" />
  <text x="24" y="627" fill="#9da7b3" font-size="14">Same 0.9 image. Cache-MMU path off / on.</text>
  <text x="24" y="660" font-size="22" font-weight="600">36 / 36</text>
  <text x="153" y="660" font-size="22" font-weight="600">10 / 10</text>
  <text x="284" y="660" font-size="22" font-weight="600">20 / 20</text>
  <text x="24" y="680" fill="#9da7b3" font-size="13">board suite</text>
  <text x="153" y="680" fill="#9da7b3" font-size="13">extra checks</text>
  <text x="284" y="680" fill="#9da7b3" font-size="13">cold boots</text>
</svg>
