<svg xmlns="http://www.w3.org/2000/svg" width="440" height="304" viewBox="0 0 440 304" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2328">
  <title id="title">SysCage</title>
  <desc id="desc">Bash malware-analysis sandbox. ELF binaries and Windows PE files through Wine run in namespaces and a temporary root filesystem, with syscall traces, optional network capture and dropped-file collection. Shared-kernel isolation, not a virtual-machine boundary; use disposable analysis environments.</desc>
  <style>.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }</style>
  <rect x="0.5" y="0.5" width="439" height="303" rx="14" fill="#f6f8fa" stroke="#cbd4de" />
  <text x="24" y="32" fill="#087e8b" font-size="13" font-weight="600" class="mono">03 / BINARY ANALYSIS</text>
  <text x="24" y="78" font-size="33" font-weight="650">SysCage</text>
  <text x="24" y="108" fill="#59636e" font-size="18">Observe binaries in a disposable rootfs.</text>
  <rect x="24" y="152" width="86" height="48" rx="6" fill="#eaf1f8" stroke="#cbd4de" />
  <text x="67" y="182" font-weight="600" text-anchor="middle" class="mono">ELF / PE</text>
  <path d="M114 176H140m-5 -5 5 5 -5 5" fill="none" stroke="#087e8b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="146" y="136" width="170" height="79" rx="8" fill="#eaf1f8" stroke="#087e8b" stroke-dasharray="5 4" />
  <text x="231" y="166" font-size="18" font-weight="500" text-anchor="middle">namespaces</text>
  <text x="231" y="192" fill="#59636e" font-size="14" text-anchor="middle" class="mono">tmpfs + strace</text>
  <path d="M320 176H346m-5 -5 5 5 -5 5" fill="none" stroke="#087e8b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M358 152H405" fill="none" stroke="#087e8b" stroke-width="3" />
  <path d="M358 165H393" fill="none" stroke="#087e8b" stroke-width="3" />
  <path d="M358 178H405" fill="none" stroke="#087e8b" stroke-width="3" />
  <path d="M358 191H387" fill="none" stroke="#087e8b" stroke-width="3" />
  <text x="24" y="235" fill="#59636e" font-size="14">Wine for PE</text>
  <text x="146" y="235" fill="#59636e" font-size="14">shared kernel</text>
  <text x="358" y="222" fill="#087e8b" font-size="14">traces</text>
  <path d="M24 250H416" fill="none" stroke="#cbd4de" stroke-width="1" />
  <text x="24" y="278" font-size="15" font-weight="500">Bash / strace / Wine</text>
  <text x="260" y="278" fill="#087e8b" font-size="15" font-weight="500">Not a VM boundary.</text>
</svg>
